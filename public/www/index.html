<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanerum Nederland · Inloggen</title>
<meta name="description" content="De werkplek van Vanerum Nederland: offertes en prijslijsten, kaarten voor proefplaatsingen en de schermen in de showroom, met één inlog.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e1e1e">
<link rel="icon" href="/www/favicon.png">
<link rel="preload" href="/fonts/NeueMontreal-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Neue Montreal";src:url(/fonts/NeueMontreal-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Neue Montreal";src:url(/fonts/NeueMontreal-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --vr-geel:#fbb900;--vr-zwart:#1e1e1e;--vr-wit:#fff;--vr-grijs:#f4f4f2;
  --vr-blauw:#b8e7f9;--vr-lila:#bda8bd;--vr-groen:#a8cb67;
  --font:"Neue Montreal",Arial,sans-serif;--rand:1.4rem;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);letter-spacing:.03em;color:var(--vr-zwart);background:var(--vr-wit);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block}
.wrap{width:min(1240px,100% - 48px);margin:0 auto}

/* ---------- kop ---------- */
body{background:var(--vr-zwart)}
.held{background:var(--vr-zwart);color:#fff;position:relative;overflow:hidden}
.held>.wrap{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.held::before{content:"";position:absolute;right:-12vw;top:-18vw;width:62vw;height:62vw;border-radius:50%;
  background:radial-gradient(closest-side,rgba(251,185,0,.16),rgba(251,185,0,0));pointer-events:none}
.balk{display:flex;align-items:center;gap:22px;padding:26px 0}
.balk .logo{height:22px;width:auto}
.balk .str{height:20px;width:auto}
.balk .rechts{margin-left:auto;display:flex;gap:22px;align-items:center;font-size:15px}
.balk .rechts a{text-decoration:none;opacity:.75;white-space:nowrap}.balk .rechts a:hover{opacity:1}

.held-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:start;padding:clamp(4px,3vh,40px) 0 24px;position:relative}
h1{font-size:clamp(34px,min(4.4vw,7.4vh),64px);line-height:1;font-weight:700;margin:0 0 clamp(14px,2.6vh,28px);letter-spacing:.005em}
h1 .geel{color:var(--vr-geel);display:block}

/* ---------- inlogkaart ---------- */
.kaart{background:#fff;color:var(--vr-zwart);border-radius:var(--rand);padding:28px;max-width:460px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.kaart h2{font-size:22px;margin:0 0 4px}
.kaart .sub{font-size:14px;color:#6b6b68;margin:0 0 18px;line-height:1.4}
.veld{margin-bottom:12px}
.veld label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.veld input{width:100%;font:inherit;font-size:16px;letter-spacing:.03em;padding:13px 14px;border:1.5px solid #e2e0da;border-radius:12px;background:var(--vr-grijs);outline:none;transition:border-color .15s,background .15s}
.veld input:focus{border-color:var(--vr-zwart);background:#fff}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:6px;font:inherit;font-weight:700;font-size:16px;letter-spacing:.03em;
  padding:15px 18px;border:0;border-radius:12px;background:var(--vr-geel);color:var(--vr-zwart);cursor:pointer;transition:transform .12s,box-shadow .12s}
.knop:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(251,185,0,.8)}
.knop:active{transform:translateY(0)}
.knop:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.knop svg{width:18px;height:18px}
.fout{color:#c0392b;font-size:14px;min-height:20px;margin-top:10px}
.klein{font-size:13px;color:#6b6b68;margin:4px 0 0}

/* ingelogd */
.tegels{display:grid;gap:10px;margin:16px 0 14px}
.tegel{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;background:var(--vr-grijs);text-decoration:none;transition:background .15s,transform .15s}
.tegel:hover{background:var(--vr-geel);transform:translateX(3px)}
.tegel img{width:52px;height:52px;border-radius:12px}
.tegel b{display:block;font-size:16px}
.tegel span{font-size:13px;color:#6b6b68}
.tegel:hover span{color:var(--vr-zwart)}
.tegel .pijl{margin-left:auto;font-size:20px;padding-right:6px}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.links a{color:#6b6b68}.links a:hover{color:var(--vr-zwart)}

/* ---------- Vimo ---------- */
.podium{position:relative;max-width:min(600px,78vh);justify-self:center;align-self:center;width:100%;-webkit-tap-highlight-color:transparent}
.podium::after{content:"";position:absolute;left:18%;right:18%;bottom:1%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));z-index:0}
.podium svg{position:relative;z-index:1;width:100%;height:auto;display:block;overflow:visible}
.fig{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.gezicht{transition:transform .25s ease-out}
.pup{transition:transform .12s ease-out,opacity .05s}
.podium{cursor:pointer}
.ballon{opacity:0;transform:translateY(8px) scale(.96);transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.ballon.zicht{opacity:1;transform:none}
.hup{animation:hup .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hup{0%{transform:translateY(0)}35%{transform:translateY(-34px)}70%{transform:translateY(0)}85%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.ww-veld{position:relative}
.ww-veld input{padding-right:48px}
.oog{position:absolute;right:6px;bottom:6px;width:38px;height:36px;border:0;border-radius:9px;background:transparent;color:#6b6b68;cursor:pointer;display:grid;place-items:center}
.oog:hover{background:#ebe9e3;color:var(--vr-zwart)}
.oog svg{width:20px;height:20px}
.oog .streep{display:none}.oog[aria-pressed="true"] .streep{display:inline}
/* ---------- voet ---------- */
footer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 22px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:rgba(255,255,255,.55)}
footer img{height:14px;width:auto}
footer a{color:#fff;text-decoration:none;font-weight:700}
footer .adres{margin-left:auto}

/* ---------- smal ---------- */
@media (max-width:700px){
  /* telefoon en tablet: kop links, Vimo rechts ernaast, inlogvak eronder */
  .held-grid{grid-template-columns:minmax(0,1fr) minmax(120px,38%);grid-template-areas:"kop vimo" "kaart kaart";gap:0 8px;align-items:end;padding-top:0}
  .held-grid>div:first-child{display:contents}
  h1{grid-area:kop;align-self:center;font-size:clamp(30px,8vw,52px)}
  .kaart{grid-area:kaart;max-width:none}
  .podium{grid-area:vimo;max-width:none;margin:0 0 4px}
  h1{margin-bottom:20px}
}
@media (max-width:520px){
  .balk{gap:14px;padding:14px 0}.balk .logo{height:17px}.balk .str{height:15px}
  .kaart{padding:22px}
  footer .adres{margin-left:0}
}
/* Vimo loopt uit beeld */
.podium.loopt svg{transform:translateX(calc(var(--weg,1) * 115vw));transition:transform 1.5s cubic-bezier(.55,0,.85,.45)}
.podium.loopt .wrap{animation:stap .36s ease-in-out infinite}
@keyframes stap{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* ingelogd: groot wit vlak met alle tools */
.held-grid.binnen{grid-template-columns:minmax(0,1fr);grid-template-areas:none;justify-items:center;align-items:center;padding:clamp(8px,4vh,56px) 0}
.held-grid.binnen>div:first-child{display:block;width:100%;max-width:1080px}
.binnen h1,.binnen .podium{display:none}
.binnen #binnen{max-width:none;width:100%;padding:clamp(24px,4vw,48px)}
.binnen #binnen.groei{animation:groei .7s cubic-bezier(.2,1.25,.4,1)}
@keyframes groei{from{opacity:0;transform:translateY(24px) scale(.94)}}
.binnen #hallo{font-size:clamp(30px,3.4vw,48px);line-height:1.1;margin-bottom:6px}
.binnen #binnen .sub{font-size:17px;margin-bottom:22px}
.binnen .tegels{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:22px}
.binnen .tegel{flex-direction:column;align-items:flex-start;gap:14px;padding:22px;border-radius:18px;position:relative}
.binnen .tegel img{width:72px;height:72px;border-radius:16px}
.binnen .tegel b{font-size:19px;margin-bottom:4px}
.binnen .tegel .pijl{position:absolute;right:20px;top:20px;font-size:24px}
.binnen .tegel:hover{transform:translateY(-3px)}
.binnen .links{font-size:15px}
@media (max-width:700px){
  .binnen .tegels{grid-template-columns:1fr;gap:10px}
  .binnen .tegel{flex-direction:row;align-items:center;padding:14px}
  .binnen .tegel img{width:56px;height:56px}
  .binnen .tegel b{font-size:17px}
  .binnen .tegel .pijl{position:static;margin-left:auto}
}
@media (max-height:760px){
  .balk{padding:16px 0}
  .kaart{padding:22px 24px}
  .kaart .sub{margin-bottom:12px}
  .veld{margin-bottom:9px}
  .veld input{padding:11px 13px}
  .knop{padding:13px 18px}
}
@media (max-height:600px){
  .kaart{padding:18px 20px}
  .kaart .sub{display:none}
  .kaart h2{margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){.tegel:hover{transform:none}}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="held">
  <div class="wrap">
    <nav class="balk">
      <img class="logo" src="/www/logo-geel-wit.png" alt="Vanerum">
      <img class="str" src="/www/streepjes.png" alt="">
      <div class="rechts">
        <a href="https://www.vanerum.nl" rel="noopener">vanerum.nl ↗</a>
      </div>
    </nav>

    <div class="held-grid">
      <div>
        <h1>Eén inlog.<span class="geel">Al je tools.</span></h1>

        <!-- niet ingelogd -->
        <form class="kaart" id="inlog" hidden>
          <h2>Inloggen</h2>
          <p class="sub">Met je Vanerum-mailadres en je wachtwoord.</p>
          <div class="veld"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="username" required></div>
          <div class="veld ww-veld"><label for="ww">Wachtwoord</label><input id="ww" type="password" autocomplete="current-password" required>
            <button type="button" class="oog" id="oog" aria-label="Wachtwoord tonen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="streep" d="M4 4l16 16"/></svg></button></div>
          <button class="knop" id="knop">Inloggen <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          <div class="fout" id="fout" role="alert"></div>
        </form>

        <!-- ingelogd -->
        <div class="kaart" id="binnen" hidden>
          <h2 id="hallo">Hallo</h2>
          <p class="sub">Hier kun je naartoe:</p>
          <div class="tegels" id="tegels"></div>
          <div class="links" id="links"></div>
        </div>
      </div>

      <div class="podium" id="podium">
        <svg id="groep" viewBox="150 40 400 450" role="img" aria-label="Vimo, de mascotte van Vanerum, kijkt mee terwijl je inlogt. Tik op hem voor een grapje."></svg>
      </div>
    </div>

    <footer>
      <img src="/www/streepjes.png" alt="">
      <a href="https://www.vanerum.nl" rel="noopener">vanerum.nl</a>
      <span class="adres">Vanerum Nederland B.V. · Edisonweg 1A, 3404 LA IJsselstein</span>
    </footer>
  </div>
</header>



<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const ACCOUNT = "https://account.vanerumnederland.nl";
  const ICOON = { offertes: "icoon-offertes.png", proefplaatsing: "icoon-kaartenmaker.png", schermen: "icoon-schermen.png", klaslokaal: "icoon-klaslokaal.png" };


  /* ---------- Vimo kijkt mee ---------- */
  const NS = "http://www.w3.org/2000/svg", INK = "#1e1e1e";
  const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const svg = $("groep");
  const S = 1.22, X = 350, Y = 410;                       // positie en grootte van Vimo
  const wrap = el("g", { class: "wrap" }, svg);           // springen
  const lijf = el("g", { class: "fig" }, wrap);           // leunen
  lijf.style.transformOrigin = `${X}px 478px`;
  const vb = el("g", { transform: `translate(${X} ${Y}) scale(${S})` }, lijf);
  [["M-10 -2 L-14 46", INK, 9], ["M10 -2 L14 46", INK, 9], ["M-10 -2 L-14 46", "#fff", 4.5], ["M10 -2 L14 46", "#fff", 4.5]]
    .forEach(([d, c, w]) => el("path", { d, stroke: c, "stroke-width": w, "stroke-linecap": "round" }, vb));
  el("ellipse", { cx: -20, cy: 48, rx: 15, ry: 8, fill: "#fff", stroke: INK, "stroke-width": 3 }, vb);
  el("ellipse", { cx: 20, cy: 48, rx: 15, ry: 8, fill: "#fff", stroke: INK, "stroke-width": 3 }, vb);
  el("path", { d: "M-124 -175 L-83 -175 L0.8 -3.3 L36 0 L-36 0 Z", fill: "#fbb900" }, vb);   // de V uit het logo
  el("path", { d: "M83 -175 L124 -175 L36 0 L0.8 -3.3 Z", fill: "#2e3033" }, vb);
  const face = el("g", { class: "gezicht" }, lijf);
  [[-31, -27, .8], [31, -27, .65]].forEach(([x, y, o]) => el("ellipse", { cx: X + x * S, cy: Y + y * S, rx: 9, ry: 5, fill: "#f2a6b8", opacity: o }, face));
  const ogen = [-42.6, 42.6].map(ex => {
    const cx = X + ex * S, cy = Y - 54 * S, rx = 14, ry = 18;
    return { cx, cy, rx, ry,
      wit: el("ellipse", { cx, cy, rx, ry, fill: "#fff", stroke: INK, "stroke-width": 3.5 }, face),
      pup: el("ellipse", { cx, cy, rx: rx * .55, ry: ry * .6, fill: INK, class: "pup" }, face),
      dicht: el("path", { d: `M${cx - rx} ${cy + 2} Q${cx} ${cy - ry * 1.05} ${cx + rx} ${cy + 2}`, fill: "none", stroke: INK, "stroke-width": 4.5, "stroke-linecap": "round", style: "display:none" }, face) };
  });
  const M = { x: X, y: Y - 14 * S, w: 16 };
  // armpjes, zoals in vimo2d: zwarte slang met witte binnenlijn en witte handschoentjes
  const armG = el("g", { transform: `translate(${X} ${Y}) scale(${S})` }, lijf);
  const slang = () => ({ u: el("path", { fill: "none", stroke: INK, "stroke-width": 9, "stroke-linecap": "round" }, armG), o: el("path", { fill: "none", stroke: "#fff", "stroke-width": 4.5, "stroke-linecap": "round" }, armG) });
  const armL = slang(), armR = slang();
  const handschoen = () => { const g = el("g", {}, armG); el("circle", { r: 10, fill: "#fff", stroke: INK, "stroke-width": 3 }, g); el("circle", { cx: -7, cy: -5, r: 4.5, fill: "#fff", stroke: INK, "stroke-width": 2.5 }, g); return g; };
  const handL = handschoen(), handR = handschoen();
  const RAD = Math.PI / 180, LA = 30, SCH = { L: [-64, -62], R: [64, -62] };
  function ledemaat(root, a1, a2) {
    const j = [root[0] + Math.sin(a1 * RAD) * LA, root[1] + Math.cos(a1 * RAD) * LA];
    const e = [j[0] + Math.sin((a1 + a2) * RAD) * LA, j[1] + Math.cos((a1 + a2) * RAD) * LA];
    return { e, d: `M${root[0]} ${root[1]} Q${(2 * j[0] - (root[0] + e[0]) / 2).toFixed(1)} ${(2 * j[1] - (root[1] + e[1]) / 2).toFixed(1)} ${e[0].toFixed(1)} ${e[1].toFixed(1)}` };
  }
  // hand naar een punt: hoeken voor schouder en elleboog (elleboog naar buiten)
  function reik(kant, tx, ty) {
    const [rx, ry] = SCH[kant], dx = tx - rx, dy = ty - ry, d = Math.min(Math.hypot(dx, dy), LA * 2 - .5) || 1;
    const th = Math.atan2(dx, dy) / RAD, al = Math.acos(d / (2 * LA)) / RAD, s = kant === "L" ? 1 : -1;
    return [th - s * al, s * 2 * al];
  }
  const arm = { L: [-22, 12], R: [22, -12] }, armDoel = { L: [-22, 12], R: [22, -12] };
  function armen(l, r) { armDoel.L = l; armDoel.R = r; }
  (function beweeg() {
    for (const k of ["L", "R"]) for (const i of [0, 1]) arm[k][i] += (armDoel[k][i] - arm[k][i]) * .22;
    const al = ledemaat(SCH.L, arm.L[0], arm.L[1]), ar = ledemaat(SCH.R, arm.R[0], arm.R[1]);
    armL.u.setAttribute("d", al.d); armL.o.setAttribute("d", al.d); armR.u.setAttribute("d", ar.d); armR.o.setAttribute("d", ar.d);
    handL.setAttribute("transform", `translate(${al.e[0].toFixed(1)} ${al.e[1].toFixed(1)})`);
    handR.setAttribute("transform", `translate(${ar.e[0].toFixed(1)} ${ar.e[1].toFixed(1)}) scale(-1 1)`);
    requestAnimationFrame(beweeg);
  })();
  const RUST = () => armen([-22 + Math.random() * 6, 12], [22 - Math.random() * 6, -12]);
  const mondRand = el("path", { fill: "none", stroke: "#fff", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, face);
  const mondEl = el("path", { fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round" }, face);

  // tekstballon
  const ballon = el("g", { class: "ballon" }, svg);
  const bRect = el("rect", { rx: 16, fill: "#fff", stroke: INK, "stroke-width": 3 }, ballon);
  const bStaart = el("path", { fill: "#fff", stroke: INK, "stroke-width": 3, "stroke-linejoin": "round" }, ballon);
  const bTekst = el("text", { "font-family": '"Neue Montreal", Arial, sans-serif', "font-weight": 700, "font-size": 23, fill: INK, "text-anchor": "middle" }, ballon);
  let ballonTimer = null;
  function zeg(tekst, ms = 3200) {
    clearTimeout(ballonTimer);
    // op een klein scherm grotere letters in de ballon, zodat hij leesbaar blijft
    const schaal = (svg.getBoundingClientRect().width || 400) / 400, fs = Math.max(23, 14 / schaal), lh = fs * 1.26, max = Math.max(12, Math.round(26 * 23 / fs * 1.15));
    bTekst.setAttribute("font-size", fs.toFixed(1));
    const regels = []; let r = "";
    for (const w of tekst.split(" ")) { if ((r + " " + w).trim().length > max) { regels.push(r.trim()); r = w; } else r += " " + w; }
    regels.push(r.trim());
    bTekst.textContent = "";
    regels.forEach((t, i) => el("tspan", { x: X, dy: i ? lh : 0 }, bTekst).textContent = t);
    const bb = bTekst.getBBox(), w = Math.max(bb.width + fs * 1.7, 120), h = regels.length * lh + fs * 1.05, top = 150 - h;
    bTekst.setAttribute("y", top + fs * 1.35);
    [...bTekst.children].forEach((t, i) => { t.setAttribute("x", X); if (!i) t.setAttribute("y", top + fs * 1.35); });
    bRect.setAttribute("x", X - w / 2); bRect.setAttribute("y", top); bRect.setAttribute("width", w); bRect.setAttribute("height", h);
    bStaart.setAttribute("d", `M${X - 12} ${top + h - 1.5} L${X} ${top + h + 16} L${X + 12} ${top + h - 1.5}`);
    ballon.classList.add("zicht");
    ballonTimer = setTimeout(() => ballon.classList.remove("zicht"), ms);
  }

  /* ---------- kijken, knipperen, stemmingen ---------- */
  let stemming = "rust", doel = null, vastTot = 0, weg = 1;
  const MOND = {
    lach: `M${M.x - M.w} ${M.y - 3} Q${M.x} ${M.y + M.w * .9} ${M.x + M.w} ${M.y - 3}`,
    grijns: `M${M.x - M.w * 1.15} ${M.y - 5} Q${M.x} ${M.y + M.w * 1.35} ${M.x + M.w * 1.15} ${M.y - 5} Z`,
    sip: `M${M.x - M.w} ${M.y + 7} Q${M.x} ${M.y - M.w * .7} ${M.x + M.w} ${M.y + 7}`,
    scheef: `M${M.x - M.w} ${M.y + 3} Q${M.x} ${M.y + 7} ${M.x + M.w} ${M.y - 7}`,
    o: `M${M.x} ${M.y - 9} a7 9 0 1 0 0.1 0 Z`,
  };
  function mond(s) { mondEl.setAttribute("d", MOND[s]); mondRand.setAttribute("d", MOND[s]); mondEl.setAttribute("fill", s === "grijns" || s === "o" ? INK : "none"); }
  function oog(open, kijk = [0, 0], dicht = false) {
    ogen.forEach((o, i) => {
      const op = Array.isArray(open) ? open[i] : open, dt = Array.isArray(dicht) ? dicht[i] : dicht;
      o.wit.style.display = o.pup.style.display = dt ? "none" : "";
      o.dicht.style.display = dt ? "" : "none";
      o.wit.setAttribute("ry", (o.ry * op).toFixed(1));
      o.pup.setAttribute("ry", (o.ry * .6 * Math.min(1, op * 1.3)).toFixed(1));
      const mx = o.rx * .45 - 1.5, my = Math.max(0, o.ry * op - o.ry * .6 - 1.5);
      o.pup.style.transform = `translate(${(kijk[0] * mx).toFixed(1)}px,${(kijk[1] * my).toFixed(1)}px)`;
    });
  }
  function leun(hoek, dx = 0, dy = 0) { lijf.style.transform = `rotate(${hoek}deg)`; face.style.transform = `translate(${dx}px,${dy}px)`; }
  function richting(px, py) {
    const m = svg.getScreenCTM(); if (!m) return [0, 0];
    const p = new DOMPoint(px, py).matrixTransform(m.inverse());
    const dx = p.x - X, dy = p.y - ogen[0].cy, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 170);
    return [dx / d * k, dy / d * k];
  }
  function kijkNaar(px, py) { const [x, y] = richting(px, py); oog(1, [x, y]); leun(x * 3, x * 7, y * 4); }
  function wegKant() { const a = svg.getBoundingClientRect(), b = $("inlog").getBoundingClientRect(); weg = a.left + a.width / 2 >= b.left + b.width / 2 ? 1 : -1; }

  function zet(s) {
    stemming = s; svg.dataset.stemming = s; wegKant();
    if (s === "rust" || s === "email") {
      mond("lach"); if (doel) kijkNaar(doel[0], doel[1]); else { oog(1); leun(0); }
      if (s === "email" && doel) {                                   // wijst naar waar je typt
        const [x, y] = richting(doel[0], doel[1]), k = x * weg < 0 ? "L" : "R", sh = SCH[k];
        const n = Math.hypot(x, y) || 1, t = reik(k, sh[0] + x / n * 56, sh[1] + y / n * 56);
        k === "L" ? armen(t, [-22, 12]) : armen([-22, 12], t);
      } else RUST();
    }
    else if (s === "dicht") { oog(1, [0, 0], true); mond("lach"); leun(weg * 4, weg * 5, -2); armen(reik("L", -41, -57), reik("R", 41, -57)); }   // wachtwoord typen: handen voor de ogen
    else if (s === "gluur") { oog([.4, .4], [-weg, .4]); mond("scheef"); leun(-weg * 3, -weg * 7, 2); armen(reik("L", -44, -30), reik("R", 44, -30)); }  // stiekem gluren over de handen
    else if (s === "sip") { oog(.8, [0, 1]); mond("sip"); leun(0, 0, 6); armen([-6, 4], [6, -4]); }
    else if (s === "blij") { oog(1, [0, 0], true); mond("grijns"); leun(0, 0, -2); armen(reik("L", -100, -120), reik("R", 100, -120)); hup(); setTimeout(hup, 620); }
  }
  function hup() { wrap.classList.remove("hup"); void wrap.getBBox(); wrap.classList.add("hup"); }

  // als je op Vimo klikt: springen en iets grappigs zeggen
  const grapjes = [
    "Ik kijk echt niet, hoor!",
    "Wachtwoord vergeten? Ik heb er geen. Ik ben een V.",
    "Psst... staat je Caps Lock niet aan?",
    "Tip: wachtwoord123 is geen wachtwoord.",
    "Inloggen is ook bewegen: tien vingers aan het werk!",
    "Eén inlog, al je tools. En ik ben gratis.",
    "Ik onthoud geen wachtwoorden, alleen gezichten.",
    "Na het inloggen even een rondje springen?",
    "Hup, inloggen! Ik tel tot drie...",
  ];
  let g = Math.floor(Math.random() * grapjes.length);
  $("podium").addEventListener("click", e => {
    e.stopPropagation(); hup(); zeg(grapjes[g++ % grapjes.length]);
    if (stemming === "rust" || stemming === "email") {
      const z = [reik("R", 96, -118), [150, -10]];
      armen([-22, 12], z[0]); setTimeout(() => armen([-22, 12], [150, 30]), 220); setTimeout(() => armen([-22, 12], z[0]), 440);
      setTimeout(() => armen([-22, 12], [150, 30]), 660); setTimeout(() => zet(stemming), 1000);
    }
    if (stemming === "rust" || stemming === "email") { mond("grijns"); setTimeout(() => zet(stemming), 900); }
  });

  // knipperen
  (function knipper() {
    setTimeout(() => {
      if (stemming === "rust" || stemming === "email") {
        ogen.forEach(o => { o.wit.setAttribute("ry", 1.5); o.pup.style.opacity = 0; });
        setTimeout(() => { ogen.forEach(o => o.pup.style.opacity = ""); zet(stemming); }, 130);
      }
      knipper();
    }, 2200 + Math.random() * 3200);
  })();

  // muis volgen; bij een klik kijkt hij even naar die plek
  addEventListener("pointermove", e => { if (stemming === "rust" && Date.now() > vastTot) { doel = [e.clientX, e.clientY]; kijkNaar(e.clientX, e.clientY); } }, { passive: true });
  addEventListener("pointerdown", e => {
    if (e.target.closest && (e.target.closest("#ww") || e.target.closest("#oog") || e.target.closest("#podium"))) return;
    doel = [e.clientX, e.clientY]; vastTot = Date.now() + 1200;
    if (stemming === "rust" || stemming === "email") kijkNaar(e.clientX, e.clientY);
  });

  // waar staat de cursor in het e-mailveld?
  const meet = document.createElement("canvas").getContext("2d");
  function cursorPunt(inp) {
    const r = inp.getBoundingClientRect(), cs = getComputedStyle(inp);
    meet.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const tekst = inp.value.slice(0, inp.selectionStart ?? inp.value.length);
    return [r.left + parseFloat(cs.paddingLeft) + Math.min(meet.measureText(tekst).width + tekst.length * .5, r.width - 30), r.top + r.height / 2];
  }
  function volgEmail() { doel = cursorPunt($("email")); zet("email"); }
  ["focus", "input", "click", "keyup"].forEach(t => $("email").addEventListener(t, volgEmail));
  $("email").addEventListener("blur", () => zet("rust"));
  function wwStemming() { zet($("ww").type === "text" && $("ww").value ? "gluur" : "dicht"); }
  ["focus", "input"].forEach(t => $("ww").addEventListener(t, wwStemming));
  $("ww").addEventListener("keydown", e => { if (e.getModifierState && e.getModifierState("CapsLock") && !ballon.classList.contains("zicht")) zeg("Let op: Caps Lock staat aan!", 2600); });
  $("ww").addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== $("ww") && document.activeElement !== $("oog")) zet("rust"); }, 0));
  $("oog").addEventListener("click", () => {
    const zien = $("ww").type === "password"; $("ww").type = zien ? "text" : "password";
    $("oog").setAttribute("aria-pressed", zien); $("oog").setAttribute("aria-label", zien ? "Wachtwoord verbergen" : "Wachtwoord tonen");
    $("ww").focus(); wwStemming();
  });
  addEventListener("resize", wegKant);
  setInterval(() => { if (stemming === "rust") RUST(); }, 1500);
  zet("rust");
  setTimeout(() => { if (!$("inlog").hidden) zeg("Hoi! Ik ben Vimo."); }, 700);

  /* ---------- inloggen ---------- */
  async function haalIk() {
    try { const r = await fetch("/api/ik", { cache: "no-store" }); if (r.ok) return await r.json(); } catch (e) {}
    return null;
  }
  const voornaamVan = ik => String(ik.naam || "").split(" ")[0];
  // het grote witte vlak met alle tools
  function toon(ik, metAnimatie) {
    $("hallo").textContent = "Hallo " + voornaamVan(ik);
    $("tegels").innerHTML = (ik.sites || []).map(s => `<a class="tegel" href="${esc(s.url)}">
        <img src="/www/${ICOON[s.id] || "favicon.png"}" alt="">
        <div><b>${esc(s.naam)}</b><span>${esc(s.url.replace(/^https?:\/\//, ""))}</span></div><div class="pijl">→</div></a>`).join("")
      || `<p class="sub">Je hebt nog nergens toegang toe.</p>`;
    $("links").innerHTML = (ik.admin ? `<a href="${ACCOUNT}/beheer">Beheer</a>` : "") + `<a href="${ACCOUNT}/wachtwoord">Wachtwoord wijzigen</a><a href="/uitloggen">Uitloggen</a>`;
    $("inlog").hidden = true; $("binnen").hidden = false;
    $("binnen").classList.toggle("groei", !!metAnimatie);
    document.querySelector(".held-grid").classList.add("binnen");
  }
  // Vimo loopt huppelend uit beeld (weg van het inlogvak)
  function loopWeg(klaar) {
    ballon.classList.remove("zicht");
    stemming = "loopt"; oog(1, [weg, 0]); mond("lach"); leun(weg * 6, weg * 8, 0);
    let stap = 0; const zwaai = setInterval(() => { stap ^= 1; armen(stap ? [-60, 20] : [20, 10], stap ? [-20, -10] : [60, -20]); }, 180);
    $("podium").style.setProperty("--weg", weg);
    $("podium").classList.add("loopt");
    setTimeout(() => { clearInterval(zwaai); klaar(); }, 1500);
  }

  $("inlog").addEventListener("submit", async e => {
    e.preventDefault(); $("knop").disabled = true; $("fout").textContent = "";
    try {
      const r = await fetch("/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: $("email").value, wachtwoord: $("ww").value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.fout || "Inloggen lukt niet");
      const ik = await haalIk();
      if (!ik) throw new Error("Inloggen lukt niet");
      if (ik.moetWijzigen) { location.href = ACCOUNT + "/wachtwoord?terug=" + encodeURIComponent(location.href); return; }
      // nog een keer springen, de naam zeggen, uit beeld lopen, dan het grote vlak met de tools
      $("ww").blur(); $("email").blur();
      zet("blij"); zeg("Welkom, " + voornaamVan(ik) + "!", 2200);
      setTimeout(() => loopWeg(() => toon(ik, true)), 2100);
      return;
    } catch (x) {
      $("fout").textContent = x.message; zet("sip"); zeg("Oei... dat klopt niet. Nog een keer?", 2800);
      setTimeout(() => { if (stemming === "sip") zet(document.activeElement === $("ww") ? "dicht" : "rust"); }, 2600);
    }
    $("knop").disabled = false;
  });

  (async () => {
    const ik = await haalIk();
    if (ik && ik.moetWijzigen) { location.href = ACCOUNT + "/wachtwoord?terug=" + encodeURIComponent(location.href); return; }
    if (ik) toon(ik, false); else $("inlog").hidden = false;
  })();
})();
</script>
</body>
</html>
